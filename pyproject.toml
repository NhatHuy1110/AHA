[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aha-joint-vqa"
version = "0.2.0"
description = "Dense answer-onset grounding with a workflow CRF for TMVP surgical video QA"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "torch>=2.3", "Pillow>=10"]

[project.scripts]
aha = "aha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
